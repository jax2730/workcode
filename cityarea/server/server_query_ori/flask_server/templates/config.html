<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <title>City Template</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        .block {
            border: 1px solid #ccc;
            padding: 16px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 8px;
        }

        input {
            padding: 4px 8px;
            margin-top: 4px;
        }

        button {
            margin-top: 12px;
            padding: 6px 12px;
        }

        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
        }

        .jsonText {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            white-space: pre-wrap;
            /* CSS3 */
            white-space: -moz-pre-wrap;
            /* Mozilla, since 1999 */
            white-space: -pre-wrap;
            /* Opera 4-6 */
            white-space: -o-pre-wrap;
            /* Opera 7 */
            word-wrap: break-word;
            /* Internet Explorer 5.5+ */
            max-height: 300px;
            overflow-y: auto;
            width: 80%;
            height: 200px;
        }
    </style>
</head>

<body>
    <h1>City Template Configuration</h1>
    <div class="block">
        <h2>distance building files upload</h2>
        <form action="/upload_building_files" method="post" enctype="multipart/form-data">
            <h3>Building files:</h3>
            <div id="fileInputs">
                <input type="file" name="building_files[]">
            </div>

            <br>
            <button type="button" onclick="addFileInput()">Add File</button>
            <br><br>

            <button type="submit">Upload</button>
        </form>
    </div>
</body>

<script>
    function addFileInput() {
        const container = document.getElementById('fileInputs');

        const input = document.createElement('input');
        input.type = 'file';
        input.name = 'building_files[]';

        container.appendChild(document.createElement('br'));
        container.appendChild(input);
    }
</script>

</html>
