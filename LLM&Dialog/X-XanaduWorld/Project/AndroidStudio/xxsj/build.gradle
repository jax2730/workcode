apply plugin: 'com.android.application'

android {
    compileSdk 33
    defaultConfig {
        applicationId "net.pixelgame.xxsj"
        minSdkVersion 24
        targetSdkVersion 32
        versionCode 1
        versionName "0.0.0.1"
        externalNativeBuild {
            cmake {
                //arguments "-DCMAKE_ANDROID_STL_TYPE=gnustl_static"
                arguments "-DANDROID_ARM_NEON=TRUE"
                cppFlags "-std=c++20 -Wall -frtti -fexceptions -fsigned-char"
            }
        }
		ndk {
            //abiFilters "armeabi-v7a", "arm64-v8a"
            abiFilters "arm64-v8a"
        }
    }


    ndkVersion="26.1.10909125"

    signingConfigs {
        pixel {
            // Key hash:yZI8Gmy68t9dcgtBs1J0JOJI7ww=
            storeFile file("pixel.jks")
            storePassword "pixel2014"
            keyAlias "mxproject"
            keyPassword "pixel2014"
        }
    }
	
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.pixel
			buildConfigField "boolean", "isVSDebug", "false"
            debuggable true
        }
        debug {
            debuggable true
            signingConfig signingConfigs.pixel
			buildConfigField "boolean", "isVSDebug", "true"
        }
        hwasan {
            initWith debug
            debuggable true
            packagingOptions {
                jniLibs {
                    // Needed for wrap.sh.
                    useLegacyPackaging = true
                }
            }
            externalNativeBuild {
                cmake {
                    arguments "-DANDROID_STL=c++_shared", "-DSANITIZE=hwasan"
                    cppFlags "-fsanitize=hwaddress", "-fno-omit-frame-pointer"
                }
            }
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }
		
    externalNativeBuild {
        cmake {
			version "3.22.1"
            path "CMakeLists.txt"
        }
    }

    buildFeatures {
        prefab true
    }
    namespace 'net.pixelgame.xxsj'
    androidResources {
        noCompress 'dpk'
    }
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.9.0'
    implementation 'androidx.games:games-activity:2.0.2'
}


if (System.getProperty("os.name").startsWith("Windows")) {
    'cmd /c cd > process.txt'.execute().getText()
    'cmd /c touchCMake.bat >> process.txt 2>&1'.execute().getText()
}
